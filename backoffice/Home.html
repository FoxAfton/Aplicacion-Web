<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container home-layout">

    <div class="left-panel">
        <h1> Mis Proyectos </h1>
        <button id="aggProyecto" class="btn-primary">Agregar Proyecto</button>

        <div id="projectList" class="project-grid"></div>
    </div>

    <div class="right-panel">
        <div id="formProject" class="form-card" style="display:none;">
            <h2 id="titulo">Nuevo Proyecto</h2>

            <form id="formulario">

                <label>Título</label>
                <input id="title" type="text" required>

                <label>Descripción</label>
                <textarea id="description" required></textarea>

                <label>Tecnologías</label>
                <input id="tech" type="text" placeholder="React, Node, Mongo">

                <label>Repositorio (URL)</label>
                <input id="repo" type="text" required>
                <button type="submit" id="saveProjectBtn" class="btn-success">Guardar</button>
                <button type="button" id="cancelForm" class="btn-danger">Cancelar</button>
            </form>
        </div>
        </div>
    </div>
    


<script src="Home.js"></script>
</body>
</html>
